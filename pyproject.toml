[tool.interrogate]
paths = ["src/brain-core/scripts"]
exclude = ["src/brain-core/scripts/_application"]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
fail-under = 79
verbose = 1

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests"]
pythonpath = [
    "src/brain-core",
    "src/brain-core/scripts",
    "src/scripts",
    "tests",
]
markers = [
    "slow: subprocess integration tests (deselect with -m 'not slow')",
    "semantic: tests requiring the optional semantic stack, e.g. numpy (deselect with -m 'not semantic'; they still skip gracefully if the stack is absent)",
]

[tool.coverage.run]
source = ["src/brain-core/scripts"]

[tool.coverage.report]
fail_under = 72
show_missing = true
