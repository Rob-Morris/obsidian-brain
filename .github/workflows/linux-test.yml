name: Linux test suite

on:
  pull_request:
  push:
    branches:
      - main
      - "promotion/**"
  workflow_dispatch:

jobs:
  candidate-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted != true
    uses: ./.github/workflows/candidate-evidence.yml

  linux-test:
    needs: candidate-evidence
    if: always() && github.event.deleted != true && (needs.candidate-evidence.result == 'skipped' || needs.candidate-evidence.outputs.reuse != 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Run test suite
        run: make test
