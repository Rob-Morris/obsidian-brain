name: Linux test suite
run-name: ${{ github.event_name == 'push' && github.event.deleted == true && 'Brain branch deletion (no CI)' || format('{0} ({1})', github.workflow, github.event_name) }}

on:
  pull_request:
  push:
    branches:
      - main
      - "promotion/**"
  workflow_dispatch:

jobs:
  candidate-evidence:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted != true
    uses: ./.github/workflows/candidate-evidence.yml

  linux-test:
    needs: candidate-evidence
    if: always() && github.event.deleted != true && (needs.candidate-evidence.result == 'skipped' || needs.candidate-evidence.outputs.reuse != 'true')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Record initial filesystem capacity
        run: |
          mkdir -p "$RUNNER_TEMP/brain-ci"
          { date -u; df -h . /tmp; df -i . /tmp; } > "$RUNNER_TEMP/brain-ci/resources.log"

      - name: Run test suite
        run: make test

      - name: Record final filesystem capacity
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/brain-ci"
          { date -u; df -h . /tmp; df -i . /tmp; } >> "$RUNNER_TEMP/brain-ci/resources.log"

      - name: Preserve test failure diagnostics
        if: always()
        run: |
          python src/scripts/collect_test_diagnostics.py \
            --failure-logs .pytest_cache/d/failure-logs \
            --resource-log "$RUNNER_TEMP/brain-ci/resources.log" \
            --destination "$RUNNER_TEMP/brain-ci/snapshot"

      - name: Upload bounded test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-diagnostics
          path: ${{ runner.temp }}/brain-ci/snapshot
          retention-days: 7
