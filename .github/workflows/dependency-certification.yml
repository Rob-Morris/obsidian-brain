name: Dependency certification

on:
  pull_request:
  push:
    branches:
      - main
      - "promotion/**"
    tags: ["v*"]
  workflow_dispatch:

jobs:
  candidate-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted != true
    uses: ./.github/workflows/candidate-evidence.yml

  native:
    needs: candidate-evidence
    if: always() && github.event.deleted != true && (needs.candidate-evidence.result == 'skipped' || needs.candidate-evidence.outputs.reuse != 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin
            machine: arm64
          - runner: ubuntu-24.04
            platform: linux
            machine: x86_64
          - runner: windows-2025
            platform: win32
            machine: AMD64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certify clean base then semantic runtime
        run: python src/scripts/dependency_certification.py --platform ${{ matrix.platform }} --machine ${{ matrix.machine }}

  certified:
    if: always() && github.event.deleted != true
    needs: [native, candidate-evidence]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every native matrix leg
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          REUSE: ${{ needs.candidate-evidence.outputs.reuse }}
        run: |
          if [ "$REUSE" = "true" ]; then
            exit 0
          fi
          test "$NATIVE_RESULT" = success
