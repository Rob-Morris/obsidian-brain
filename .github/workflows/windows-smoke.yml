name: Windows user smoke
run-name: ${{ github.event_name == 'push' && github.event.deleted == true && 'Brain branch deletion (no CI)' || format('{0} ({1})', github.workflow, github.event_name) }}

on:
  pull_request:
  push:
    branches:
      - main
      - "promotion/**"
  workflow_dispatch:

jobs:
  candidate-evidence:
    permissions:
      contents: read
      actions: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.deleted != true
    uses: ./.github/workflows/candidate-evidence.yml

  windows-user-smoke:
    needs: candidate-evidence
    if: always() && github.event.deleted != true && (needs.candidate-evidence.result == 'skipped' || needs.candidate-evidence.outputs.reuse != 'true')
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install --no-deps -r dependencies/requirements-dev.txt
          .\.venv\Scripts\python.exe src/brain-core/scripts/_common/_venv.py verify --requirements dependencies/requirements-dev.txt

      - name: Run native Windows user smoke
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q tests/test_windows_user_smoke.py tests/application/test_mcp_stable_bootstrap.py
