required:
  type:
    const: "living/task"
  key:
    type: string
    pattern: "^(?=.{1,64}$)(?=.*[a-z])[a-z0-9]+(?:-[a-z0-9]+)*$"
  tags:
    type: array
    contains: "task"
optional:
  status:
    enum: [open, shaping, in-progress, done, parked, deprecated]
    default: open
  kind:
    enum: [bug, feature, chore, spike, decision]
  priority:
    enum: [critical, high, medium, low]
  assigned:
    type: string
  claimed_at:
    type: string
    format: iso-datetime
