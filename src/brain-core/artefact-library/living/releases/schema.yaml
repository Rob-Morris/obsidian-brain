required:
  type:
    const: "living/release"
  key:
    type: string
    pattern: "^(?=.{1,64}$)(?=.*[a-z])[a-z0-9]+(?:-[a-z0-9]+)*$"
  tags:
    type: array
    contains: "release"
  parent:
    type: string
optional:
  status:
    enum: [planned, active, shipped, deprecated]
    default: planned
  version:
    type: string
  tag:
    type: string
  commit:
    type: string
  shipped:
    type: string
