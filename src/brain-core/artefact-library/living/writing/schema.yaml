required:
  type:
    const: "living/writing"
  key:
    type: string
    pattern: "^(?=.{1,64}$)(?=.*[a-z])[a-z0-9]+(?:-[a-z0-9]+)*$"
  tags:
    type: array
    contains: "writing"
optional:
  status:
    enum: [draft, editing, review, published, deprecated, parked]
    default: draft
  publisheddate:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
