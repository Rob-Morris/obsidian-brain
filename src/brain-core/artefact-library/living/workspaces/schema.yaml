required:
  type:
    const: "living/workspace"
  key:
    type: string
    pattern: "^(?=.{1,64}$)(?=.*[a-z])[a-z0-9]+(?:-[a-z0-9]+)*$"
  tags:
    type: array
    contains: "workspace/{key}"
optional:
  workspace:
    type: string
    description: "Canonical self-reference workspace/{key}; omitted hubs remain self-scoped."
  default_parent:
    type: string
    description: "Non-terminal living parent in this workspace, managed by workspace.update-policy."
  default_tags:
    type: array
    description: "Additive semantic-mutation defaults, managed by workspace.update-policy."
  status:
    enum: [active, parked, completed, deprecated]
    default: active
  workspace_mode:
    enum: [embedded, linked]
    default: embedded
