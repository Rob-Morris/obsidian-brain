    maintainer:
      allow: [artefact.archive, artefact.convert, artefact.create, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, memory.create, memory.list, memory.read, memory.search, plugin.create, plugin.list, plugin.read, plugin.replace, plugin.search, retrieval.construct-benchmark, retrieval.evaluate, retrieval.rebuild-semantic, retrieval.refresh-lexical, runtime.read-environment, runtime.refresh-router, session.start, shaping.render-presentation, shaping.render-printable, shaping.start, skill.create, skill.list, skill.read, skill.search, stage.create, stage.discard, style.create, style.list, style.read, style.search, template.create, template.list, template.read, trigger.create, trigger.delete, trigger.list, trigger.read, trigger.replace, trigger.search, type.create, type.list, type.read, type.replace, type.status, type.sync, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.list, workspace.read]
    operator:
      allow: [artefact.archive, artefact.convert, artefact.create, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, memory.create, memory.list, memory.read, memory.search, plugin.create, plugin.list, plugin.read, plugin.replace, plugin.search, retrieval.construct-benchmark, retrieval.enable, retrieval.evaluate, retrieval.rebuild-semantic, retrieval.refresh-lexical, retrieval.repair-semantic, runtime.read-environment, runtime.refresh-router, session.start, shaping.render-presentation, shaping.render-printable, shaping.start, skill.create, skill.list, skill.read, skill.search, stage.create, stage.discard, style.create, style.list, style.read, style.search, template.create, template.list, template.read, trigger.create, trigger.delete, trigger.list, trigger.read, trigger.replace, trigger.search, type.create, type.list, type.read, type.replace, type.status, type.sync, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.bind, workspace.configure-bootstrap, workspace.list, workspace.read, workspace.register, workspace.repair-registry, workspace.setup, workspace.unregister, workspace.update-metadata]
    administrator:
      allow: [artefact.archive, artefact.convert, artefact.create, artefact.delete, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, memory.create, memory.list, memory.read, memory.search, plugin.create, plugin.list, plugin.read, plugin.replace, plugin.search, retrieval.construct-benchmark, retrieval.enable, retrieval.evaluate, retrieval.rebuild-semantic, retrieval.refresh-lexical, retrieval.repair-semantic, runtime.read-environment, runtime.refresh-router, session.start, shaping.render-presentation, shaping.render-printable, shaping.start, skill.create, skill.list, skill.read, skill.search, stage.create, stage.discard, style.create, style.list, style.read, style.search, template.create, template.list, template.read, trigger.create, trigger.delete, trigger.list, trigger.read, trigger.replace, trigger.search, type.create, type.list, type.read, type.replace, type.status, type.sync, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.bind, workspace.configure-bootstrap, workspace.list, workspace.read, workspace.register, workspace.repair-registry, workspace.setup, workspace.unregister, workspace.update-metadata]

  operators: []

defaults:
  default_profile: operator

  flags:
    semantic_processing: false
    semantic_retrieval: false

  local_runtime:
    semantic_engine_installed: false

  tool_paths: {}

  exclude:
    artefact_sync: []
