# Brain vault configuration
#
# Two zones:
#   vault:    shared authority — not overridable by .brain/local/config.yaml
#   defaults: customisable per-machine via .brain/local/config.yaml
#
# Merge rules within defaults (inferred from data type):
#   Scalars:  local wins if present
#   Booleans: either-true wins (if either file says true, it's true)
#   Lists:    additive (union of both lists)

vault:
  brain_name: ""

  access:
    elevation_policy: automatic
    default_lease_seconds: 900
    max_lease_seconds: 3600
    pending_seconds: 900
    max_use_count: 100

  profiles:
    reader:
      allow: [access.reduce, access.request, access.status, artefact.list, artefact.outline, artefact.read, artefact.search, command.describe, command.list, content.classify, content.resolve, links.check, resource.list, resource.read, resource.search, runtime.read-environment, runtime.status, runtime.warmup, session.start, type.status, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.list, workspace.read]
    contributor:
      allow: [access.reduce, access.request, access.status, artefact.archive, artefact.convert, artefact.create, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, resource.create, resource.list, resource.read, resource.search, runtime.read-environment, runtime.status, runtime.warmup, session.start, shaping.render, shaping.start, stage.create, stage.discard, type.status, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.list, workspace.read]
    maintainer:
      allow: [access.reduce, access.request, access.status, artefact.archive, artefact.convert, artefact.create, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, plugin.create, plugin.replace, resource.create, resource.list, resource.read, resource.search, retrieval.construct-benchmark, retrieval.evaluate, retrieval.rebuild-semantic, retrieval.refresh-lexical, runtime.read-environment, runtime.refresh-router, runtime.status, runtime.warmup, session.start, shaping.render, shaping.start, stage.create, stage.discard, trigger.create, trigger.delete, trigger.replace, type.create, type.replace, type.status, type.sync, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.list, workspace.read]
    operator:
      allow: [access.reduce, access.request, access.status, artefact.archive, artefact.convert, artefact.create, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, plugin.create, plugin.replace, resource.create, resource.list, resource.read, resource.search, retrieval.construct-benchmark, retrieval.enable, retrieval.evaluate, retrieval.rebuild-semantic, retrieval.refresh-lexical, retrieval.repair-semantic, runtime.read-environment, runtime.refresh-router, runtime.status, runtime.warmup, session.start, shaping.render, shaping.start, stage.create, stage.discard, trigger.create, trigger.delete, trigger.replace, type.create, type.replace, type.status, type.sync, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.bind, workspace.configure-bootstrap, workspace.list, workspace.read, workspace.register, workspace.repair-registry, workspace.setup, workspace.unregister, workspace.update-metadata]
    administrator:
      allow: [access.reduce, access.request, access.status, artefact.archive, artefact.convert, artefact.create, artefact.delete, artefact.list, artefact.migrate-naming, artefact.outline, artefact.read, artefact.rename, artefact.repair, artefact.reparent, artefact.reparent-children, artefact.search, artefact.set-key, artefact.set-naming-field, artefact.set-status, artefact.unarchive, attachment.upload, command.describe, command.list, content.classify, content.ingest, content.resolve, document.edit, invocation.read, links.check, links.fix, plugin.create, plugin.replace, resource.create, resource.list, resource.read, resource.search, retrieval.construct-benchmark, retrieval.enable, retrieval.evaluate, retrieval.rebuild-semantic, retrieval.refresh-lexical, retrieval.repair-semantic, runtime.read-environment, runtime.refresh-router, runtime.status, runtime.warmup, session.start, shaping.render, shaping.start, stage.create, stage.discard, trigger.create, trigger.delete, trigger.replace, type.create, type.replace, type.status, type.sync, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.bind, workspace.configure-bootstrap, workspace.list, workspace.read, workspace.register, workspace.repair-registry, workspace.setup, workspace.unregister, workspace.update-metadata]

  operators: []

defaults:
  default_profile: operator

  access:
    initial_profile: reader

  flags:
    semantic_processing: false
    semantic_retrieval: false

  local_runtime:
    semantic_engine_installed: false

  tool_paths: {}

  exclude:
    artefact_sync: []
