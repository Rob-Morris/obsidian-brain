# Brain vault configuration
#
# Two zones:
#   vault:    shared authority — not overridable by .brain/local/config.yaml
#   defaults: customisable per-machine via .brain/local/config.yaml
#
# Merge rules within defaults (inferred from data type):
#   Scalars:  local wins if present
#   Booleans: either-true wins (if either file says true, it's true)
#   Lists:    additive (union of both lists)

vault:
  brain_name: ""

  profiles:
    reader:
      allow: [artefact.list, artefact.outline, artefact.read, artefact.search, command.describe, command.list, content.classify, content.resolve, links.check, memory.list, memory.read, memory.search, plugin.list, plugin.read, plugin.search, runtime.read-environment, session.start, skill.list, skill.read, skill.search, style.list, style.read, style.search, template.list, template.read, trigger.list, trigger.read, trigger.search, type.list, type.read, type.status, vault.check, vault.read-config, vault.read-file, vault.read-router, workspace.list, workspace.read]
    contributor:
