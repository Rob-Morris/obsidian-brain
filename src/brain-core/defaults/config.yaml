# Brain vault configuration
#
# Two zones:
#   vault:    shared authority — not overridable by .brain/local/config.yaml
#   defaults: customisable per-machine via .brain/local/config.yaml
#
# Merge rules within defaults (inferred from data type):
#   Scalars:  local wins if present
#   Booleans: either-true wins (if either file says true, it's true)
#   Lists:    additive (union of both lists)

vault:
  brain_name: ""

  profiles:
    reader:
      allow: [brain_init, brain_session, brain_read, brain_outline, brain_check, brain_search, brain_list, brain_classify, brain_resolve]
    contributor:
      allow: [brain_init, brain_session, brain_read, brain_outline, brain_check, brain_search, brain_list, brain_classify, brain_resolve, brain_stage, brain_discard_stage, brain_upload_attachment, brain_create, brain_edit, brain_reparent, brain_set_status, brain_set_key, brain_set_naming_field, brain_ingest]
    operator:
      allow: [brain_init, brain_session, brain_read, brain_outline, brain_check, brain_search, brain_list, brain_classify, brain_resolve, brain_stage, brain_discard_stage, brain_upload_attachment, brain_create, brain_edit, brain_reparent, brain_set_status, brain_set_key, brain_set_naming_field, brain_ingest, brain_define, brain_move, brain_action]

  operators: []

defaults:
  default_profile: operator

  flags:
    semantic_processing: false
    semantic_retrieval: false

  local_runtime:
    semantic_engine_installed: false

  tool_paths: {}

  exclude:
    artefact_sync: []
